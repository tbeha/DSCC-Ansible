---
- name: Volume-Snapshot-Export
# Required Parameter
#   VolumeName
#   SnapshotName
#   HostGroupName
# ansible-playbook Export-Volume-Snapshot.yaml -e "VolumeName=' '..."
  hosts: localhost

- name: Export Snapshots
  hosts: localhost
  vars:
    method: "GET"
    request_uri: "/api/v1/volumes?filter=name%20eq%20'{{VolumeName}}'"
  tasks:

    - name: DSCC API Call - Get Volume
      ansible.builtin.include_tasks:
        file: DSCC-API-Call.yaml

    - name: Retry the command if status 401
      ansible.builtin.include_tasks:
        file: DSCC-API-401.yaml
      when: status == 401

    - name: Set resourceURI      
      ansible.builtin.set_fact:
        request_uri: "{{ result.json['items'][0].resourceUri }}/snapshots"

    - name: DSCC API Call Get Volume Snapshots
      ansible.builtin.include_tasks:
        file: DSCC-API-Call.yaml

    - name: Initialize Snapshot dictionary
      ansible.builtin.set_fact:
        snapshots: "{{ snapshots | default({}) }}"

    - name: Loop through Snaspshots
      ansible.builtin.set_fact:
        snapshots: "{{ snapshots | combine({item.name: {'id': item.id, 'systemId':item.systemId}}) }}"
      with_items: "{{ response.json['items'] }}"

    - name: Check Snapshot Name and set URL
      vars:
        key: "{{ SnapshotName }}"
      ansible.builtin.set_fact:
        snapshot: "{{ snapshots[key] }}"
      when: SnapshotName is defined and SnapshotName != "" 

    - name: Read host_groups.json
      ansible.builtin.set_fact:
        host_groups: "{{ lookup('file', '../Outputs/host_groups.json') }}"

    - name: Get hostgroup
      vars:
        key: "{{ HostGroupName }}"
      ansible.builtin.set_fact:
        hostgroup:
          - "{{ host_groups[key] }}"

    - name: Read systems.json
      ansible.builtin.set_fact:
        systems: "{{ lookup('file', '../Outputs/systems.json') }}"

    - name: Search the systems list
      vars:
        key: "{{ item }}"
      ansible.builtin.set_fact:
        systemuri: "{{ systems[key].resourceUri }}"
      with_items: "{{ systems }}"
      when: systems[key].id == snapshot.systemId

    - name: Build Body
      ansible.builtin.set_fact:
        body:
          hostGroupIds: "{{ hostgroup }}"
          autoLun: "true"
      when: LUN is not defined

    - name: Set resourceURI      
      ansible.builtin.set_fact:
        request_uri: "{{ systemuri}}/snapshots/{{ snapshot.id }}/export"
        method: "POST"

    - name: DSCC API Call 
      ansible.builtin.include_tasks:
        file: DSCC-API-Call.yaml

    - name: Retry the command if status 401
      ansible.builtin.include_tasks:
        file: DSCC-API-401.yaml
      when: status == 401

    - name: Show results 
      vars:
        elementname: "Volume"
        result: "{{ response }}"
      ansible.builtin.include_tasks:
        file: DisplayResults.yaml 

