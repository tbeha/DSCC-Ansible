---
- name: UnExport volume
# UnExport Volume playbook
# v2.0 10/21/2024 Thomas Beha
#
# Parameters:
#   VolumeName - name of volume that should be exported
#   HostGroupName - name of the hostgroup the volume should be exported to
#  
# Run command:
#   ansible-playbook UnExport-Volume.yaml -e "VolumeName='<volumeName>' HostGroupName='<hostgroupName>"
#
  hosts: localhost
  vars:
    #method: "POST"
    #request_uri: "{{ myvol['resourceUri'] }}/un-export"
    method: "GET"
    request_uri: "/api/v1/volumes?filter=name%20eq%20'{{VolumeName}}'"
  tasks:
    # First get Volume Uri
    - name: DSCC API Call - Get Volume
      ansible.builtin.include_tasks:
        file: DSCC-API-Call.yaml

    - name: Retry the command if status 401 - Get Volume
      ansible.builtin.include_tasks:
        file: DSCC-API-401.yaml
      when: status == 401

    - name: Set Volume Resoure Uri
      ansible.builtin.set_fact:
        vol_uri: "{{ result.json['items'][0].resourceUri }}"
    
    # 2. Get HostGroup
    - name: Set HostGroup request_uri
      ansible.builtin.set_fact:
        request_uri: "/api/v1/host-initiator-groups?filter=name%20eq%20'{{HostGroupName}}'"
    
    - name: DSCC API Call - Get HostGroup
      ansible.builtin.include_tasks:
        file: DSCC-API-Call.yaml

    - name: Retry the command if status 401 - Get Host Group
      ansible.builtin.include_tasks:
        file: DSCC-API-401.yaml
      when: status == 401

    - name: Set HostGroup
      ansible.builtin.set_fact:
        hostgroup: "{{ result.json['items'][0].id }}"

    - name: Set body, method and request Uri
      ansible.builtin.set_fact:
        method: "POST"
        request_uri: "/api/v1/volumes?filter=name%20eq%20'{{VolumeName}}'"
        body:
          hostGroupIds: "{{ hostgroup }}"

    - name: DSCC API Call GET storage systems
      ansible.builtin.include_tasks:
        file: DSCC-API-Call.yaml

    - name: Retry the command if status 401
      ansible.builtin.include_tasks:
        file: DSCC-API-401.yaml
      when: status == 401

    - name: Show Results
      vars:
        elements: dscs_hosts
        elementname: "Unexport Volume"
        result: "{{ response }}"
      ansible.builtin.include_tasks:
        file: DisplayResults.yaml
