---
#- import_playbook: Get-Volumes.yaml 
#- import_playbook: Get-HostGroups.yaml
- name: Export volume playbook
# Export Volume playbook
# v1.0 9/27/2024 Thomas Beha
#
# Parameters:
#   VolumeName - name of volume that should be exported
#   HostGroupName - name of the hostgroup the volume should be exported to
# Optional:
#   LUN         Custom LUN Id for multiple host groups  - Array of objects or null
#               "LUN": [
#                 {
#                   "LUN": 34,
#                   "hostGroupId": "cb17544e9347145d22a0fac608831053",
#                   "nvmeTransportType": "TCP"
#                 }
#               ],
#   autoLun     boolean or null
#   maxAutoLun  Number of volumes.
#   proximity   Host proximity setting for Active Peer Persistence configuration.
#               Supported values are - PRIMARY, SECONDARY and ALL. Default proximity is PRIMARY.
#
# Run command:
#   ansible-playbook Export-Volume.yaml -e "VolumeName='<volumeName>' HostGroupName='<hostgroupName>"
#
  hosts: localhost
  vars:  
    method: "GET"
    request_uri: "/api/v1/volumes?filter=name%20eq%20'{{VolumeName}}'"
  tasks:

    - name: DSCC API Call - Get Volume
      ansible.builtin.include_tasks:
        file: DSCC-API-Call.yaml

    - name: Retry the command if status 401 - Get Volume
      ansible.builtin.include_tasks:
        file: DSCC-API-401.yaml
      when: status == 401

    - name: Set Volume
      ansible.builtin.set_fact:
        resourceUri: "{{ result.json['items'][0].resourceUri }}"

    - name: Set HostGroup request_uri
      ansible.builtin.set_fact:
        request_uri: "/api/v1/host-initiator-groups?filter=name%20eq%20'{{HostGroupName}}'"
    
    - name: DSCC API Call - Get HostGroup
      ansible.builtin.include_tasks:
        file: DSCC-API-Call.yaml

    - name: Retry the command if status 401 - Get Host Group
      ansible.builtin.include_tasks:
        file: DSCC-API-401.yaml
      when: status == 401

    - name: Set HostGroup
      ansible.builtin.set_fact:
        hostgroup: "{{ result.json['items'][0].id }}"

    - name: Set body
      ansible.builtin.set_fact:
        body:
          hostGroupIds: "{{ hostgroup}}"
          autoLun: true
      when: LUN is not defined

    - name: Check LUN
      ansible.builtin.set_fact:
        body:
          autoLun: false
          LUN: "[{ LUN: {{ LUN }}, hostGroupId: {{ hostgroup }} }]"
      when: LUN is defined and LUN != ""

    - name: Set Request Uri
      ansible.builtin.set_fact:
        request_uri: "{{ resourceUri }}/export"  

    - name: Set Method
      ansible.builtin.set_fact:
        method: POST

    - name: DSCC API Call - Export Volume
      ansible.builtin.include_tasks:
        file: DSCC-API-Call.yaml

    - name: Retry the command if status 401 - Export Volume
      ansible.builtin.include_tasks:
        file: DSCC-API-401.yaml
      when: status == 401

    - name: Show results 
      vars:
        elementname: "Volume"
        result: "{{ response }}"
      ansible.builtin.include_tasks:
        file: DisplayResults.yaml 